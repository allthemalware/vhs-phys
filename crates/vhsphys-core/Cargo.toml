[package]
name = "vhsphys-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Physical model of VHS record/playback: tape, heads, mechanics and deck electronics"

[dependencies]
rayon = "1"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "small_rng"] }
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
toml = "0.9"
