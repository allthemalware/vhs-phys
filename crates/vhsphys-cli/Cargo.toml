[package]
name = "vhsphys-cli"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Standalone command line front end for the VHS physical model"

[[bin]]
name = "vhsphys"
path = "src/main.rs"

[dependencies]
vhsphys-core = { path = "../vhsphys-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
